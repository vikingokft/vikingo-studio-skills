# vikingo-studio-skills — forrás-manifest
#
# Egy sor = egy forrás. Mezők pipe-pal (|) elválasztva, a köztes szóközök nem számítanak:
#
#   mode | id | repo | ref | from | to
#
#   mode : vendored  → a skillek BE VANNAK MÁSOLVA a repóba (nyílt licenc, újraosztható)
#          external  → a skillek NINCSENEK bemásolva; az install-skills.sh telepítéskor
#                      a felhasználó gépére klónozza őket az eredeti repóból (licenc
#                      nélküli források — így nincs újraosztás, jogtiszta marad)
#   id   : rövid azonosító (a klón-cache mappaneve external módban)
#   repo : git klón URL
#   ref  : branch vagy tag vagy commit SHA (high-trust: main; óvatos: pinned SHA)
#   from : a repón belüli útvonal, AMI ALATT rekurzívan keressük a SKILL.md-ket
#   to   : a cél domain-mappa ebben a repóban (vendored), ill. csak besorolás (external)
#
# A SKILL.md-t tartalmazó mappa NEVE lesz a telepített skill neve.
# Új forrás: vegyél fel egy sort, futtasd a sync-et (vendored) vagy az install-t (external).

# ---- VENDORED (bemásolt, nyílt licencű) -------------------------------------
vendored | stripe           | https://github.com/stripe/agent-toolkit.git            | main | skills           | payments
vendored | stitch           | https://github.com/google-labs-code/stitch-skills.git  | main | plugins          | design
vendored | gemini           | https://github.com/google-gemini/gemini-skills.git     | main | skills           | google
vendored | workspace        | https://github.com/googleworkspace/cli.git             | main | skills           | google
vendored | frontend-security| https://github.com/schalkneethling/webdev-agent-skills.git | main | frontend-security | web

# ---- EXTERNAL (telepítéskor húzott, licenc nélküli) -------------------------
external | claude           | https://github.com/anthropics/skills.git               | main | skills           | ai
external | openai           | https://github.com/openai/skills.git                   | main | skills/.curated  | ai
external | notion           | https://github.com/makenotion/claude-code-notion-plugin.git | main | skills        | docs
external | vercel           | https://github.com/vercel-labs/agent-skills.git        | main | skills           | web
